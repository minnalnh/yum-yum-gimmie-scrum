<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location</title>
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/location.css">
</head>
<body>
    <div class="wrapper wrapper--greenleaf">
        <header class="header">
                <img class="header__icon" src="./resources/icons/menu-icon.svg" alt="menu">
                <img class="header__icon" src="./resources/icons/cart-icon.svg" alt="cart">
        </header>
    <section class="card">
        <h1 class="card__title">Välj foodtruck</h1>
        <img class="card__img" src="./resources/images/map.jpg" alt="map">
        <section class="card__text-section">
            <h2 class="card__subtitle">stadsparken</h2>
            <h3 class="card__distance">100 m</h3>
            <section class="card__distance-section">
                <p class="card__description">Stadsparksgatan 1, Karlstad</p>
            </section>
        </section>
        <section class="card__text-section">
            <h2 class="card__subtitle">Stora torget</h2>
            <h3 class="card__distance">1 km</h3>
            <section class="card__distance-section">
                <p class="card__description">Stora torget 1, Karlstad</p>
            </section>
        </section>
        <section class="btn-section">
            <a href="" class="btn btn--red btn--full" >Gå till menyn</a>
        </section>
    </section>

    </div>
    
</body>
</html>
