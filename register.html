<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Log in</title>
		<link rel="stylesheet" href="./styles/base.css" />
		<link rel="stylesheet" href="./styles/login-register.css" />
	</head>
	<body>
		<div class="wrapper wrapper--greenleaf">
			<header class="logo-header">
				<img src="./resources/icons/logo.jpg" class="logo" alt="Yum Yum Gimme Some logotype" />
			</header>
			<section class="form-container">
				<form class="form" id="registerForm">
					<div class="form__group">
						<label for="nameInput" class="form__label">Namn</label>
						<input type="text" class="form__input" id="regName" placeholder="Förnamn Efternamn" required />
					</div>
					<div class="form__group">
						<label for="emailInput" class="form__label">E-post</label>
						<input type="email" class="form__input" id="regEmail" placeholder="exempel@exempel.se" required />
					</div>
					<div class="form__group">
						<label for="passwordInput" class="form__label">Lösenord</label>
						<input type="password" class="form__input" id="regPassword" placeholder="••••••••••" required />
					</div>
					<div class="form__group">
						<label for="passwordInput" class="form__label">Upprepa lösenord</label>
						<input type="password" class="form__input" id="regRepeatPassword" placeholder="••••••••••" required />
					</div>
					<button class="btn btn--grey" id="createAccountBtn">Skapa konto</button>
				</form>
			</section>
		</div>
	</body>
</html>
