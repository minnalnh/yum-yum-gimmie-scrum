<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Yum Yum Gimme Sum</title>
		<link rel="stylesheet" href="../styles/base.css" />
		<link rel="stylesheet" href="../styles/login-register.css" />
		<script type="module" src="../scripts/modules/registerUser.js"></script>
	</head>

	<body>
		<div class="wrapper wrapper--greenleaf">
			<header class="logo-header">
				<a href="../index.html" class="logo-header__index-link"><img src="../resources/icons/logo.jpg" class="logo" alt="Yum Yum Gimme Some logotype" /></a>
			</header>
			<section class="form-container">
				<h1 class="login-title">Skapa konto</h1>
				<p class="form__confirmation d-none" id="accountRegConf">
					Ditt konto har skapats.<br />
					Vänligen logga in.
				</p>
				<form class="form" id="registerForm">
					<div class="form__group">
						<label for="regName" class="form__label">Namn<span class="error-msg" id="nameError"></span></label>
						<input type="text" class="form__input" id="regName" placeholder="Förnamn Efternamn" />
					</div>
					<div class="form__group">
						<label for="regEmail" class="form__label">E-post<span class="error-msg" id="emailError"></span></label>
						<input type="email" class="form__input" id="regEmail" placeholder="exempel@exempel.se" />
					</div>
					<div class="form__group">
						<label for="regPassword" class="form__label">Lösenord<span class="error-msg" id="passwordError"></span></label>
						<input type="password" class="form__input" id="regPassword" placeholder="••••••••••" />
					</div>
					<div class="form__group">
						<label for="regRepeatPassword" class="form__label">Upprepa lösenord<span class="error-msg" id="passwordRepeatError"></span></label>
						<input type="password" class="form__input" id="regRepeatPassword" placeholder="••••••••••" />
					</div>
					<button type="submit" class="btn btn--grey" id="createAccountBtn">Skapa konto</button>
					<a href="./login.html" class="form__skip-register">Har du redan ett konto? Gå till logga in.</a>
				</form>
				<a href="login.html" class="btn btn--red d-none" id="loginBtnRegPage">Logga in</a>
			</section>
		</div>
	</body>
</html>
