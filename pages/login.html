<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Yum Yum Gimme Sum</title>
		<link rel="stylesheet" href="../styles/base.css" />
		<link rel="stylesheet" href="../styles/login-register.css" />
		<script type="module" src="../scripts/modules/loginUser.js"></script>
		<!-- <script type="module" src="../scripts/script.js"></script> -->
		<!-- <script type="module" src="../scripts/modules/gui.js"></script> -->
	</head>
	<body>
		<div class="wrapper wrapper--greenleaf">
			<header class="logo-header">
				<a href="../index.html" class="logo-header__index-link"><img src="../resources/icons/logo.jpg" class="logo" alt="Yum Yum Gimme Some logotype" /></a>
			</header>
			<section class="form-container">
				<form class="form" id="loginForm">
					<div class="form__group">
						<label for="loginEmail" class="form__label">E-post<span class="error-msg" id="emailError"></span></label>
						<input type="email" class="form__input" id="loginEmail" placeholder="exempel@exempel.se" />
					</div>
					<div class="form__group">
						<label for="loginPassword" class="form__label">Lösenord<span class="error-msg" id="passwordError"></span></label>
						<input type="password" class="form__input" id="loginPassword" placeholder="••••••••••" />
					</div>
					<button type="submit" class="btn btn--red" id="loginBtn">Logga in</button>
					<a href="./register.html" class="btn btn--grey" id="goToRegister">Skapa konto</a>
				</form>
			</section>
		</div>
	</body>
</html>
