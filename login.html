<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Log in</title>
		<link rel="stylesheet" href="./styles/base.css" />
		<link rel="stylesheet" href="./styles/login-register.css" />
	</head>
	<body>
		<div class="wrapper wrapper--greenleaf">
			<header class="logo-header">
				<img src="./resources/icons/logo.jpg" class="logo" alt="Yum Yum Gimme Some logotype" />
			</header>
			<section class="form-container">
				<form class="form" id="loginForm">
					<div class="form__group">
						<label for="emailInput" class="form__label">E-post</label>
						<input type="email" class="form__input" id="emailInput" placeholder="exempel@exempel.se" />
					</div>
					<div class="form__group">
						<label for="passwordInput" class="form__label">Lösenord</label>
						<input type="password" class="form__input" id="passwordInput" placeholder="••••••••••" />
					</div>
					<button type="submit" class="btn btn--red">Logga in</button>
					<a href="./register.html" class="btn btn--grey" id="goToRegister">Skapa konto</a>
				</form>
			</section>
		</div>
	</body>
</html>
